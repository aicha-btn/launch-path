name: Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    env:
      # `next build` importe les modules serveur et valide ces variables au
      # chargement. La CI ne demarre pas de base : `pnpm verify` ne s'y connecte pas.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify
